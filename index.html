	<!-- Background animation -->
	<script>
	(function () {
		const canvas = document.getElementById('bg-canvas');
		const ctx = canvas.getContext('2d');
		let W, H, shapes;

		function resize() {
			W = canvas.width = window.innerWidth;
			H = canvas.height = window.innerHeight;
		}

		function Shape() {
			this.reset(true);
		}

		Shape.prototype.reset = function (initial) {
			this.x = Math.random() * W;
			this.y = initial ? Math.random() * H : (Math.random() < 0.5 ? -120 : H + 120);
			this.r = 40 + Math.random() * 120;
			this.vx = (Math.random() - 0.5) * 0.18;
			this.vy = (Math.random() - 0.5) * 0.18;
			this.alpha = 0.12 + Math.random() * 0.18;
			this.type = Math.random() < 0.5 ? 'circle' : 'rect';
			this.rot = Math.random() * Math.PI * 2;
			this.rotSpeed = (Math.random() - 0.5) * 0.002;
		};

		Shape.prototype.draw = function () {
			ctx.save();
			ctx.globalAlpha = this.alpha;
			ctx.strokeStyle = document.body.classList.contains('light') ? 'rgba(0,0,0,1)' : 'rgba(255,255,255,1)';
			ctx.lineWidth = 1.5;
			ctx.translate(this.x, this.y);
			ctx.rotate(this.rot);
			if (this.type === 'circle') {
				ctx.beginPath();
				ctx.arc(0, 0, this.r, 0, Math.PI * 2);
				ctx.stroke();
			} else {
				ctx.strokeRect(-this.r / 2, -this.r / 2, this.r, this.r);
			}
			ctx.restore();
		};

		Shape.prototype.update = function () {
			this.x += this.vx;
			this.y += this.vy;
			this.rot += this.rotSpeed;
			if (this.x < -200 || this.x > W + 200 || this.y < -200 || this.y > H + 200) {
				this.reset(false);
			}
		};

		function init() {
			resize();
			shapes = Array.from({ length: 18 }, function () { return new Shape(); });
		}

		function loop() {
			ctx.clearRect(0, 0, W, H);
			shapes.forEach(function (s) { s.update(); s.draw(); });
			requestAnimationFrame(loop);
		}

		window.addEventListener('resize', function () {
			resize();
		});

		init();
		loop();
	})();
	</script>

	<script>
	(function () {
		var btn = document.getElementById('theme-toggle');
		var saved = localStorage.getItem('theme');
		if (saved === 'light') {
			document.body.classList.add('light');
			btn.textContent = '🌙';
		}
		btn.addEventListener('click', function () {
			var isLight = document.body.classList.toggle('light');
			btn.textContent = isLight ? '🌙' : '☀';
			localStorage.setItem('theme', isLight ? 'light' : 'dark');
		});
	})();
	</script>
